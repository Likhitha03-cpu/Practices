<body>
    <script>
        async function addSeries(a,b){
          
            return await add(a,b);
        }
         function add(a,b){
            var sum=0;
            for(let i=a;i<b;i++){
                sum += i;
            }
            return sum;
         }
         addSeries(0,10).then(function(result) { console.log(result); });
        console.log("hi");
    </script>
</body>
