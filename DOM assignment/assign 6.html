<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <input type="text" id="d1" placeholder="enter src">
    <button onclick="image()">Add Image</button>
</head>
<body>
    <script>
        // var i=prompt("enter the src");
        
        function image(){
            var i=document.getElementById("d1").value;
            var img=document.createElement("img");
            img.src=i;
            img.width="500";
            img.height="500";
            document.body.appendChild(img);
        }
        // image();
    </script>
</body>
</html>
