<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(, 200px);
            gap: 10px;
        }
        #item1 {
            grid-column: 1 / 3;
            grid-row: 1 / 2;
        }
        #item2 {
            grid-column: 3 / 5;
            grid-row: 1 / 2;
        }
        #item3 {
            grid-column: 1 / 4;
            grid-row: 2 / 3;
        }
        /* #item4 {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
        }
        #item5 {
            grid-column: 3 / 5;
            grid-row: 2 / 3;
        }
        #item6 {
            grid-column: 1 / 3;
            grid-row: 3 / 4;
        }
        #item7 {
            grid-column: 3 / 5;
            grid-row: 3 / 4;
        } */
    </style>
</head>
<body>
    <div style="background-color: lightcoral;" id="item1">Item 1</div>
    <div style="background-color: lightblue;"id="item2">Item 2</div>
    <div style="background-color: lightgreen;"id="item3">Item 3</div>
    <div style="background-color: lightgoldenrodyellow;"id="item4">Item 4</div>
    <div style="background-color: lightpink;"id="item5">Item 5</div>
    <div style="background-color: lightgray;"id="item6">Item 6</div>
    <div style="background-color: lightseagreen;"id="item7">Item 7</div>
</body>
</html>
