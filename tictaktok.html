<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    const canvas = document.createElement('canvas');
    canvas.width = 400;
    canvas.height = 400;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let board = [
        ['', '', ''],
        ['', '', ''],
        ['', '', '']
    ];
    let currentPlayer = 'X';
    function drawBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 2;
        for (let i = 1; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 100, 0);
            ctx.lineTo(i * 100, 300);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * 100);
            ctx.lineTo(300, i * 100);
            ctx.stroke();
        }
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                if (board[i][j] === 'X') {
                    ctx.beginPath();
                    ctx.moveTo(j * 100 + 20, i * 100 + 20);
                    ctx.lineTo(j * 100 + 80, i * 100 + 80);
                    ctx.moveTo(j * 100 + 80, i * 100 + 20);
                    ctx.lineTo(j * 100 + 20, i * 100 + 80);
                    ctx.stroke();
                } else if (board[i][j] === 'O') {
                    ctx.beginPath();
                    ctx.arc(j * 100 + 50, i * 100 + 50, 30, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }
    }
    function checkWin() {
        for (let i = 0; i < 3; i++) {
            if (board[i][0] && board[i][0] === board[i][1] && board[i][1] === board[i][2]) {
                return board[i][0];
            }
            if (board[0][i] && board[0][i] === board[1][i] && board[1][i] === board[2][i]) {
                return board[0][i];
            }
        }
        if (board[0][0] && board[0][0] === board[1][1] && board[1][1] === board[2][2]) {
            return board[0][0];
        }
        if (board[0][2] && board[0][2] === board[1][1] && board[1][1] === board[2][0]) {
            return board[0][2];
        }
        return null;
    }
    canvas.addEventListener('click', (e) => {
        const x = Math.floor(e.offsetX / 100);
        const y = Math.floor(e.offsetY / 100);
        if (!board[y][x]) {
            board[y][x] = currentPlayer;
            drawBoard();
            const winner = checkWin();
            if (winner) {
                alert(winner + ' wins!');
                board = [
                    ['', '', ''],
                    ['', '', ''],
                    ['', '', '']
                ];
                drawBoard();
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            }
        }
    });
    drawBoard();


    </script>
</body>
</html>
