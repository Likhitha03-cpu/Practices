<!DOCTYPE html>
<html>
<head>
  <title>Tic Tac Toe</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 5px;
      justify-content: center;
      margin-top: 30px;
    }
    .cell {
      width: 100px;
      height: 100px;
      font-size: 40px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Tic Tac Toe</h1>
<h2 id="status">Player X Turn</h2>

<div class="board">
  <button class="cell" ></button>
  <button class="cell" ></button>
  <button class="cell"></button>
  <button class="cell" ></button>
  <button class="cell" ></button>
  <button class="cell" ></button>
  <button class="cell" ></button>
  <button class="cell" ></button>
  <button class="cell" ></button>
</div>

<script>
    let cells = document.querySelectorAll(".cell");

cells.forEach((cell, index) => {
  cell.addEventListener("click", function () {
    play(cell, index);
  });
});
let board = ["","","","","","","","",""];
let currentPlayer = "X";
let gameOver = false;

function play(cell, index) {
  if (board[index] !== "" || gameOver) return;

  board[index] = currentPlayer;
  cell.innerHTML = currentPlayer;

  if (checkWin()) {
    document.getElementById("status").innerHTML =
      "Player " + currentPlayer + " Wins!";
    gameOver = true;
    return;
  }
  currentPlayer = currentPlayer === "X" ? "O" : "X";
  document.getElementById("status").innerHTML =
    "Player " + currentPlayer + " Turn";
}

function checkWin() {
  let wins = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  for (let p = 0; p < wins.length; p++) {
    let pattern = wins[p];
    let isWin = true;
    for (let i = 0; i < pattern.length; i++) {
      if (board[pattern[i]] !== currentPlayer) {
        isWin = false;
        break;
      }
    }
    if (isWin) {
      return true;
    }
  }

  return false;
}
</script>

</body>
</html>
