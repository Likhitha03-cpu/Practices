<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr;
        }
        #header {
            grid-row: 1 / 2;
            grid-column: 1/2;
            background-color: #4CAF50;
            color: white;
        }
        #content {
            grid-row: 2 / 3;
             grid-column: 1 / 3;
            background-color: white;
            padding: 20px;
        }
        @media (max-width: 600px) {
            body {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto;
            }
            #header {
                grid-row: 1 / 2;
                grid-column: 1 / 2;
            }
            #content {
                grid-row: 2 / 3;
                grid-column: 1 / 2;
            }
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>Welcome to My Website</h1>
        <p>This is a simple webpage created with HTML and CSS.</p>
    </div>
    <div id="content">
        <h2>About Me</h2>
        <p>Hello! I'm a web developer with a passion for creating beautiful and functional websites. I love learning new technologies and improving my skills.</p>
        <h2>My Hobbies</h2>
        <ul>
            <li>Coding</li>
            <li>Photography</li>
            <li>Traveling</li>
            <li>Reading</li>
        </ul>
</body>
</html>
