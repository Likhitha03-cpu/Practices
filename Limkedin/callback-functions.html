<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function add(a,b,callback){
            var sum=a+b;
            callback(sum);
        }
        
        add(5,10,function(result){
            console.log(result);
        });

    </script>
</body>
</html>
